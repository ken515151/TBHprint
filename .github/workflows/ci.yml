# docs/DISTRIBUTION_DESIGN.md section 7. Two jobs deliberately: they are
# the repo's actual floor-and-ceiling Python/OS pair (Python 3.10 on
# Ubuntu 22.04 - the oldest supported distro per section 1 - and Python
# 3.12 on Windows, which is what build/windows/build.ps1 embeds). The
# Windows job also runs the print-to-PDF integration test because that's
# the one GitHub-hosted runner image with "Microsoft Print to PDF"
# already installed - see docs section 5's own verification notes.
name: CI

on:
  push:
    branches: ["main", "packaging"]
  pull_request:

jobs:
  test-linux:
    name: pytest (ubuntu-22.04, py3.10)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tbhprint (dev + tray extras)
        run: python -m pip install -e ".[dev,tray,keyring]"
      - name: pytest
        run: python -m pytest -v

  test-windows:
    name: pytest (windows-latest, py3.12, incl. print-to-PDF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tbhprint (dev + tray extras)
        run: python -m pip install -e ".[dev,tray,keyring]"
      - name: pytest (whole suite - includes the Windows print-to-PDF test)
        run: python -m pytest -v
