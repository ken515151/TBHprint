[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbhprint"
dynamic = ["version"]
description = "TBHprint - the TechBenchHub print agent: prints labels, booking sheets and invoices from TechBenchHub straight to a shop PC's printers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ken Peddie" }]
dependencies = [
    "requests>=2.31",
    "websockets>=12",
    "pypdfium2>=4.30; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=9"]   # >=9: Ubuntu 22.04 ships python3-pil 9.0 (the .deb uses the distro Pillow)
keyring = ["keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
tbhprint = "tbhprint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tbhprint.__version__" }

[tool.setuptools.packages.find]
include = ["tbhprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
