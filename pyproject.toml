[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbhprint"
version = "0.1.0"
description = "TBHprint - the TechBenchHub print agent: prints labels, booking sheets and invoices from TechBenchHub straight to a shop PC's printers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ken Peddie" }]
dependencies = [
    "requests>=2.31",
    "websockets>=12",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
tbhprint = "tbhprint.cli:main"

[tool.setuptools.packages.find]
include = ["tbhprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
